name: compile

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - run: npm run compile -w extensions/simply-at4dx

      - run: npm run test -w extensions/simply-at4dx
